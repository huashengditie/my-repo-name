# Compact 1D CNN (D1) from Grand Development Plan.md:
# input -> small stem Conv1D -> depthwise-separable blocks -> global average
# pooling -> one raw seizure logit.  Channel count is derived from
# channels_chbmit.yaml, never duplicated here.
stem:
  out_channels: 16
  kernel_size: 7
  stride: 1
  padding: 3
  pool_size: 4

depthwise_separable_blocks:
  - out_channels: 32
    kernel_size: 5
    stride: 1
    padding: 2
    pool_size: 4
  - out_channels: 48
    kernel_size: 3
    stride: 1
    padding: 1
    pool_size: null

num_classes: 1
